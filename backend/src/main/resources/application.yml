server:
  port: 8080

spring:
  application:
    name: issuetracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issuetracker}
    username: ${DB_USER:issuetracker}
    password: ${DB_PASSWORD:issuetracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-use-a-long-random-string}
    expiration-ms: 86400000
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
